<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Flor | Flores del Valle</title>

    <link rel="stylesheet" th:href="@{/style.css}">

</head>

<body>

<header class="navbar">

    <div class="logo">
        🌸 Flores del Valle
    </div>

    <nav>

        <a th:href="@{/}">
            Inicio
        </a>

        <a th:href="@{/inventario}">
            Inventario
        </a>

        <a th:href="@{/pedidos}">
            Pedidos
        </a>

        <a th:href="@{/entregas}">
            Entregas
        </a>

        <a th:href="@{/facturas}">
            Finanzas
        </a>

        <a th:href="@{/reportes}">
            Reportes
        </a>

    </nav>

</header>


<main class="container">

    <section class="welcome">

        <h1 th:if="${flor.id == null}">
            🌷 Registrar flor
        </h1>

        <h1 th:if="${flor.id != null}">
            ✏️ Editar flor
        </h1>

        <p th:if="${flor.id == null}">
            Agrega una nueva flor al inventario.
        </p>

        <p th:if="${flor.id != null}">
            Modifica la información de la flor seleccionada.
        </p>

    </section>


    <div class="card">

        <form th:action="@{/inventario/guardar}"
              th:object="${flor}"
              method="post">

            <!-- =================================================
                 ID OCULTO
                 Importante para editar registros existentes
                 ================================================= -->

            <input type="hidden" th:field="*{id}">


            <!-- =================================================
                 TIPO
                 ================================================= -->

            <div style="margin-bottom: 20px;">

                <label for="tipo">
                    <strong>Tipo de flor</strong>
                </label>

                <input
                    type="text"
                    id="tipo"
                    th:field="*{tipo}"
                    placeholder="Ej. Rosa"
                    required
                    style="width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ccc; border-radius: 6px;"
                >

            </div>


            <!-- =================================================
                 COLOR
                 ================================================= -->

            <div style="margin-bottom: 20px;">

                <label for="color">
                    <strong>Color</strong>
                </label>

                <input
                    type="text"
                    id="color"
                    th:field="*{color}"
                    placeholder="Ej. Rojo"
                    required
                    style="width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ccc; border-radius: 6px;"
                >

            </div>


            <!-- =================================================
                 VARIEDAD
                 ================================================= -->

            <div style="margin-bottom: 20px;">

                <label for="variedad">
                    <strong>Variedad</strong>
                </label>

                <input
                    type="text"
                    id="variedad"
                    th:field="*{variedad}"
                    placeholder="Ej. Rosa roja"
                    required
                    style="width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ccc; border-radius: 6px;"
                >

            </div>


            <!-- =================================================
                 CANTIDAD
                 ================================================= -->

            <div style="margin-bottom: 20px;">

                <label for="cantidadDisponible">
                    <strong>Cantidad disponible</strong>
                </label>

                <input
                    type="number"
                    id="cantidadDisponible"
                    th:field="*{cantidadDisponible}"
                    min="0"
                    placeholder="Ej. 50"
                    required
                    style="width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ccc; border-radius: 6px;"
                >

            </div>


            <!-- =================================================
                 PRECIO DE COMPRA
                 ================================================= -->

            <div style="margin-bottom: 20px;">

                <label for="precioCompra">
                    <strong>Precio de compra</strong>
                </label>

                <input
                    type="number"
                    id="precioCompra"
                    th:field="*{precioCompra}"
                    min="0"
                    step="0.01"
                    placeholder="Ej. 3000"
                    required
                    style="width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ccc; border-radius: 6px;"
                >

            </div>


            <!-- =================================================
                 PRECIO DE VENTA
                 ================================================= -->

            <div style="margin-bottom: 25px;">

                <label for="precioVenta">
                    <strong>Precio de venta</strong>
                </label>

                <input
                    type="number"
                    id="precioVenta"
                    th:field="*{precioVenta}"
                    min="0"
                    step="0.01"
                    placeholder="Ej. 5000"
                    required
                    style="width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ccc; border-radius: 6px;"
                >

            </div>


            <!-- =================================================
                 BOTONES
                 ================================================= -->

            <div>

                <button
                    type="submit"
                    class="btn"
                    style="border: none; cursor: pointer;">

                    💾 Guardar flor

                </button>


                <a
                    th:href="@{/inventario}"
                    class="btn"
                    style="background-color: #64748b; margin-left: 10px;">

                    ↩️ Cancelar

                </a>

            </div>

        </form>

    </div>

</main>


<footer>

    <p>
        Flores del Valle © 2026 |
        Sistema de gestión de floristería
    </p>

</footer>


</body>

</html>
